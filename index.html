<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个网页</title>
    <style>
        /* 这里放CSS样式 */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
        }
    </style>
</head>
<body>
    <h1>欢迎来到我的网页！</h1>
    <p>这是一个基础的HTML页面。</p>
    <p>我可以在这里添加更多内容：</p>
    <ul>
        <li>列表项1</li>
        <li>列表项2</li>
        <li>列表项3</li>
    </ul>
    
    <!-- 添加一张图片 -->
    <img src="https://via.placeholder.com/300x200" alt="示例图片">
    
    <!-- 添加一个链接 -->
    <p>访问 <a href="https://www.example.com" target="_blank">示例网站</a></p>
</body>
</html>
